
  name: Spring Boot Build and Deploy

  on:
    push:
      branches:
        - main

  env:
    IMAGE_NAME: spring-boot-web-app

  jobs:
    build-deploy:
      runs-on: ubuntu-latest

      steps:

        # 1. Checkout code
        - name: Checkout Source
          uses: actions/checkout@v4

        # 2. Setup Java 21
        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: maven

        # 3. Build Spring Boot application
        - name: Build Spring Boot Application
          run: mvn clean package -DskipTests

        # 4. Login to Docker Hub
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        # 5. Build Docker image
        - name: Build Docker Image
          run: |
            docker build \
              -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

        # 6. Push Docker image to Docker Hub
        - name: Push Docker Image
          run: |
            docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

        # 7. Deploy to existing EC2
        - name: Deploy to EC2
          uses: appleboy/ssh-action@v1.2.2
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ubuntu
            key: ${{ secrets.EC2_SSH_KEY }}

            script: |
              echo "Pulling latest Docker image..."
              
              sudo docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
              
              echo "Stopping old container..."
              
              sudo docker stop spring-boot-app || true
              
              echo "Removing old container..."
              
              sudo docker rm spring-boot-app || true
              
              echo "Starting new container..."
              
              sudo docker run -d \
                --name spring-boot-app \
                --restart unless-stopped \
                -p 8080:8080 \
                ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
              
              echo "Removing unused Docker images..."
              
              sudo docker image prune -f
              
              echo "Deployment completed successfully!"
